#!/usr/sbin/nft -f

table inet filter
flush table inet filter

define SSH_PORT		= 6734
define WEB_PORTS	= { 80, 443 }

table inet filter {
	chain input {
		type filter hook input priority filter; policy drop;

		# --- loopback ---
		iif lo accept
		iif != lo ip daddr 127.0.0.1/8 drop
		iif != lo ip6 daddr ::1/128 drop

		# already extablished connecctions
		ct state {established, related} accept
		ct state invalid drop

		ip protocol icmp icmp type { destination-unreachable, time-exceeded, parameter-problem } accept

		ip6 nexthdr icmpv6 icmpv6 type {
			destination-unreachable, time-exceeded, parameter-problem,
			nd-router-solicit, nd-router-advert, nd-neighbor-solicit, nd-neighbor-advert
		} accept

		# --- Allowing ports ---
		tcp dport $SSH_PORT accept
		tcp dport $WEB_PORTS accept
	}
	chain forward {
		type filter hook forward priority filter; policy accept;
	}
	chain output {
		type filter hook output priority filter; policy accept;
	}
}
